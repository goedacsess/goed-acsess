name: Build Windows Installer

# Dipicu manual, atau otomatis saat tag versi didorong.
# Build macOS tetap dikerjakan di mesin lokal karena sertifikat signing
# Apple ada di sana dan sengaja tidak disimpan di repo.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis tujuan, misal v2.4.4"
        required: true
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi
        run: npm ci

      - name: Build dan unggah installer Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
