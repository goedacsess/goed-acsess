name: Build Windows Installer

# Hanya dipicu manual (cadangan kalau Mac tidak tersedia). Rilis biasa sudah
# membangun installer Windows dari Mac lewat `npm run publish:win`; kalau workflow
# ini juga jalan otomatis saat tag dibuat, dua build berlomba mengunggah .exe dan
# latest.yml, dan checksum update otomatis bisa tidak cocok.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis tujuan, misal v2.4.4"
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang dependensi
        run: npm ci

      - name: Build dan unggah installer Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
